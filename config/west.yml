manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: dhruvinsh
      url-base: https://github.com/dhruvinsh
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    # Tracking `main` (currently Zephyr 4.1) rather than a release tag, so
    # breaking changes land automatically. To pin instead, set this to a tag
    # such as `v0.3` and match it in .github/workflows/build.yml.
    # See https://zmk.dev/blog/2025/06/20/pinned-zmk
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-tri-state
      remote: dhruvinsh
      revision: main
  self:
    path: config
