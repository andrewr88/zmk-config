# Uncomment the following line to enable the Corne RGB Underglow
# (CONFIG_WS2812_STRIP is no longer needed as of Zephyr 4.1 - it is
#  enabled automatically via devicetree)
# CONFIG_ZMK_RGB_UNDERGLOW=y


# Enable pointing device support (CONFIG_ZMK_MOUSE was deprecated in favour
# of CONFIG_ZMK_POINTING). Nothing in this keymap binds &mkp/&mmv/&msc yet,
# so this can be dropped entirely to save flash.
CONFIG_ZMK_POINTING=y

# Combo sizing (CONFIG_ZMK_COMBO_MAX_COMBOS_PER_KEY and
# CONFIG_ZMK_COMBO_MAX_KEYS_PER_COMBO are deprecated - both are now
# auto-calculated from the key-positions in the keymap devicetree)

# Improve responsiveness and battery life
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

# Bluetooth settings
CONFIG_ZMK_BLE_CLEAR_BONDS_ON_START=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# USB settings (CONFIG_ZMK_USB is redundant here - the nice_nano `zmk` board
# variant already enables it on the central half, and it cannot be enabled on
# the peripheral half at all)

# Settings for better mod-tap and layer-tap behavior
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
